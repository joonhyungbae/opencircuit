# conda 환경 정의.
#
#   conda env create -f environment.yml
#   conda activate <환경이름>
#   python run.py --sim
#
# 소리 쪽(portaudio, libsndfile)은 conda 로 깐다. pip 로만 깔면 「libportaudio 를 찾을 수 없다」
# 같은 오류가 잘 난다. 나머지는 pip 로 깐다.
name: <환경이름>
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - portaudio          # 스피커로 소리를 내보내는 바탕
  - libsndfile         # wav 파일 읽고 쓰기
  - python-sounddevice
  - pysoundfile
  - pip:
      - fastapi>=0.115
      - uvicorn>=0.30
      - websockets>=12
      - python-osc>=1.8
      - mediapipe>=0.10
      - opencv-python>=4.9
